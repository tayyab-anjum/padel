apiVersion: apps/v1
kind: Deployment
metadata:
  name: padel-range-web
  labels:
    app: padel-range-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: padel-range-web
  template:
    metadata:
      labels:
        app: padel-range-web
    spec:
      containers:
        - name: app
          image: tayyyaab/padel:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NITRO_HOST
              value: 0.0.0.0
            - name: NITRO_PORT
              value: "3000"
            - name: PORT
              value: "3000"
            - name: VITE_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: padel-range-secrets
                  key: VITE_SUPABASE_URL
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: padel-range-secrets
                  key: VITE_SUPABASE_ANON_KEY
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: padel-range-web
  labels:
    app: padel-range-web
spec:
  type: NodePort
  selector:
    app: padel-range-web
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
